<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>RED DEVILS HUB — 2026-27</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="match-view.css">
<style>
  :root {
    --bg:#ffffff; --bg-soft:#f7f7f9; --card:#ffffff;
    --text:#14141a; --text-mid:#4a4a57; --text-dim:#86868f;
    --border:#e6e6ec; --border-soft:#f0f0f4;
    /* 팀 색 토큰 — HUB_TEAM.applyTheme()이 선택된 팀 색으로 :root에 덮어쓴다. 아래는 스크립트 전 기본값(맨유) */
    --accent:#DA291C; --accent-soft:rgba(218,41,28,.08); --accent-2:#e7746b;
    --accent-glow:rgba(218,41,28,.08); --accent-glow2:rgba(218,41,28,.16);
    --fav-bg:rgba(218,41,28,.07); --fav-border:rgba(218,41,28,.35);
    --gbar-bg:rgba(218,41,28,.10); --gbar-border:rgba(218,41,28,.35);
    --chip-bg:#f2f2f5;
    /* 팀과 무관하게 고정 — 사이트 이름·일요일·오류 배너 */
    --brand:#DA291C; --sun:#dc2626; --err:#DA291C; --err-bg:#fdf1f0; --err-border:#f5c9c5;
    --bar-bg:rgba(255,255,255,.85);
    --win:#16a34a; --draw:#8a8a94; --loss:#dc2626;
    --z-ucl:#2563eb; --z-uel:#f97316; --z-uecl:#16a34a; --z-rel:#dc2626;
    --shadow:0 1px 2px rgba(20,20,26,.04),0 10px 30px -14px rgba(20,20,26,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e0e11; --bg-soft:#141419; --card:#16161b;
      --text:#f0f0f3; --text-mid:#b6b6c0; --text-dim:#82828e;
      --border:#26262e; --border-soft:#1e1e25;
      --accent:#FF3B30; --accent-soft:rgba(255,59,48,.12); --accent-2:#ff8a83;
      --accent-glow:rgba(255,59,48,.10); --accent-glow2:rgba(255,59,48,.20);
      --fav-bg:rgba(255,59,48,.15); --fav-border:rgba(255,59,48,.45);
      --gbar-bg:rgba(255,59,48,.16); --gbar-border:rgba(255,59,48,.45);
      --chip-bg:#1e1e25;
      --brand:#FF3B30; --sun:#f05252; --err:#FF3B30; --err-bg:#24181b; --err-border:#4a2a2f;
      --bar-bg:rgba(14,14,17,.85);
      --win:#22c55e; --draw:#82828e; --loss:#f05252;
      --z-ucl:#3b82f6; --z-uel:#fb923c; --z-uecl:#22c55e; --z-rel:#f05252;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; font-feature-settings:"tnum" 1, "ss05" 1; }
  @media (prefers-color-scheme: dark) { body { background:radial-gradient(1200px 600px at 20% -10%, var(--accent-glow), transparent 60%), var(--bg); } }
  a { color:inherit; }
  .wrap { max-width:1680px; margin:0 auto; padding:0 32px; }

  /* 상단 바 */
  .top { position:sticky; top:0; z-index:30; background:var(--bar-bg); backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px); border-bottom:1px solid var(--border-soft); }
  .top-inner { display:flex; align-items:center; gap:14px; padding:12px 0; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:900; font-size:19px; letter-spacing:.02em; font-style:italic; text-decoration:none; white-space:nowrap; }
  .brand img { width:26px; height:26px; object-fit:contain; }
  .brand .accent { color:var(--brand); }
  .brand .yr { font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--text-dim); border:1px solid var(--border); padding:2px 7px; border-radius:6px; margin-left:4px; font-style:normal; }
  .top .meta { color:var(--text-dim); font-size:12.5px; margin-left:6px; padding-left:14px; border-left:1px solid var(--border); white-space:nowrap; }
  .top .sp { flex:1; }
  .btn { border:1px solid var(--border); background:var(--chip-bg); color:var(--text-mid); font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:.15s; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { color:var(--text); border-color:var(--text); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn .ic { width:14px; height:14px; }

  /* 오류 배너 */
  .jserr { display:none; margin:12px 0 0; padding:10px 14px; border-radius:10px; border:1px solid var(--err-border); background:var(--err-bg); color:var(--err); font-size:12.5px; }
  .jserr.on { display:block; }
  .err { padding:14px 16px; font-size:12.5px; color:var(--err); background:var(--err-bg); border:1px solid var(--err-border); border-radius:10px; margin:8px; }

  /* 배지 */
  .bdg { position:relative; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; }
  .bdg img { width:100%; height:100%; object-fit:contain; display:block; }
  .bdg i { display:none; position:absolute; inset:0; border-radius:50%; background:var(--bc,#8a8a94); color:#fff; font-style:normal; font-weight:800; letter-spacing:-0.03em; align-items:center; justify-content:center; font-size:calc(var(--bs,22px) * 0.36); }
  .bdg.nb i { display:flex; }

  /* 대회 태그 */
  .ctag { display:inline-flex; align-items:center; font-size:10px; font-weight:800; letter-spacing:.02em; padding:2px 6px; border-radius:5px; line-height:1.5; background:var(--chip-bg); color:var(--text-mid); white-space:nowrap; }
  .ctag.pl { background:rgba(56,0,60,.10); color:#7a0b78; } .ctag.ucl { background:rgba(37,99,235,.13); color:#2563eb; }
  .ctag.uel { background:rgba(249,115,22,.15); color:#c2410c; } .ctag.uecl { background:rgba(22,163,74,.14); color:#15803d; }
  .ctag.fac { background:rgba(124,58,237,.13); color:#6d28d9; } .ctag.efl { background:rgba(13,148,136,.14); color:#0f766e; }
  .ctag.fr { background:var(--chip-bg); color:var(--text-dim); }
  @media (prefers-color-scheme: dark) {
    .ctag.pl { background:rgba(214,60,210,.16); color:#e879f5; } .ctag.uel { color:#fb923c; } .ctag.uecl { color:#4ade80; }
    .ctag.fac { color:#a78bfa; } .ctag.efl { color:#2dd4bf; }
  }

  /* 레이아웃 */
  .grid { display:grid; grid-template-columns:minmax(0,1fr) 320px 408px; gap:20px; padding:24px 0 0; align-items:stretch; }
  .col2, .col3 { display:flex; flex-direction:column; gap:18px; min-width:0; }
  .col2 > .card, .col3 > .card { flex:0 0 auto; }
  .col2 > .card.grow, .col3 > .card.grow { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .row2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; margin-top:22px; align-items:start; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); position:relative; overflow:hidden; min-width:0; }
  .card-h { display:flex; align-items:center; gap:10px; padding:16px 20px 12px; border-bottom:1px solid var(--border-soft); }
  .card-h h2 { margin:0; font-size:12px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:var(--text-dim); white-space:nowrap; }
  .card-h .sub { font-size:12px; color:var(--text-dim); margin-left:auto; font-variant-numeric:tabular-nums; text-align:right; }
  .card-b { padding:18px 20px; }

  /* ---------- 달력 ---------- */
  .cal-nav { display:flex; align-items:center; gap:8px; padding:16px 20px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
  .cal-nav h2 { margin:0 6px; font-size:23px; font-weight:800; letter-spacing:-0.04em; min-width:142px; }
  .nav-btn { border:1px solid var(--border); background:var(--chip-bg); color:var(--text); width:34px; height:34px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:.15s; }
  .nav-btn svg { width:14px; height:14px; }
  .nav-btn:hover { border-color:var(--text); background:var(--bg-soft); }
  .cal-nav .sp { flex:1; }
  .legend { display:flex; gap:12px; font-size:11.5px; color:var(--text-dim); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .dows, .week { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .dow { padding:11px 0 9px; text-align:center; font-size:11px; font-weight:700; color:var(--text-dim); letter-spacing:.12em; border-bottom:1px solid var(--border-soft); }
  .dow.sat { color:#3b82f6; } .dow.sun { color:var(--sun); }
  .week { position:relative; }
  .cell { grid-row:1; min-height:150px; min-width:0; overflow:hidden; padding:9px 5px; border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); display:flex; flex-direction:column; gap:3px; position:relative; transition:background .15s; min-width:0; }
  .cell:hover { background:var(--bg-soft); }
  .cell:nth-child(7) { border-right:none; }
  .week:last-child .cell { border-bottom:none; }
  .cell.out { opacity:.34; }
  .cell.today { background:radial-gradient(220px 120px at 30% 0%, var(--accent-soft), transparent 70%); }
  .cell .d { font-size:14px; font-weight:700; color:var(--text-mid); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:5px; letter-spacing:-0.02em; white-space:nowrap; margin-bottom:var(--rsv,0px); }
  .cell.today .d { color:var(--accent); }
  .cell.sun .d { color:var(--sun); } .cell.sat .d { color:#3b82f6; }
  .today-tag { font-size:9.5px; font-weight:700; background:var(--accent); color:#fff; padding:1px 5px; border-radius:999px; line-height:1.5; }
  .mx { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .mrow { display:flex; flex-wrap:wrap; align-items:center; gap:2px; font-size:9.5px; line-height:1.5; padding:1px; border-radius:4px; color:var(--text-mid); min-width:0; }
  .mrow .hn, .mrow .an { flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; letter-spacing:-0.01em; }
  .mrow .hn { text-align:right; }
  .mrow .sc { flex:0 0 auto; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text); font-size:9px; letter-spacing:-0.04em; }
  .mrow .tgw { flex:0 0 100%; line-height:1; margin-bottom:2px; }
  .mrow .tgw .ctag { font-size:8px; padding:1px 4px; line-height:1.4; }
  .mrow.fav { background:var(--fav-bg); color:var(--accent); font-weight:700; box-shadow:inset 2px 0 0 var(--accent); }
  .mrow.fav .sc { color:var(--accent); }
  .cell:not(.open) .mrow.xtra { display:none; }
  .more { align-self:flex-start; margin-top:1px; border:1px solid var(--border); background:var(--chip-bg); color:var(--text-dim); font:inherit; font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:999px; cursor:pointer; }
  .more:hover { border-color:var(--text-dim); color:var(--text); }
  .mwbar { grid-row:1; align-self:start; height:20px; z-index:2; text-decoration:none; display:flex; align-items:center; padding:0 8px; font-size:11px; transition:.15s; font-weight:800; letter-spacing:-0.01em; color:var(--accent); background:var(--gbar-bg); border:1px solid var(--gbar-border); border-radius:5px; margin-left:5px; margin-right:5px; white-space:nowrap; overflow:hidden; cursor:pointer; }
  .mwbar.out { opacity:.35; }
  .mwbar:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .mwbar .ar { margin-left:auto; font-size:9.5px; font-weight:600; opacity:0; transition:.15s; }
  .mwbar:hover .ar { opacity:1; }
  .brief { margin-top:auto; font-size:11px; font-weight:700; text-decoration:none; color:var(--text); background:var(--chip-bg); border:1px solid var(--border); padding:4px 6px; border-radius:8px; text-align:center; transition:.15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.02em; display:flex; align-items:center; justify-content:center; gap:5px; }
  .brief::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); flex:0 0 auto; }
  .brief:hover { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

  /* ---------- 다음 경기 ---------- */
  .next-hero { padding:13px 14px; margin:-4px -4px 0; border-radius:14px; border:1px solid var(--border-soft); position:relative; overflow:hidden; isolation:isolate;
    background:linear-gradient(135deg, var(--accent-soft), transparent 70%); }
  .next-hero::after { content:""; position:absolute; right:-30px; top:50%; width:160px; height:160px; margin-top:-80px; z-index:-1; border-radius:50%;
    background:radial-gradient(circle, var(--accent-glow2), transparent 65%); animation:breath 3.6s ease-in-out infinite; }
  @keyframes breath { 0%,100% { transform:scale(.9); opacity:.6; } 50% { transform:scale(1.1); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .next-hero::after, .track i.now { animation:none; } }
  .nh-top { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .nh-main { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .nh-b { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .nh-b .vs { font-size:11px; font-weight:800; color:var(--text-dim); font-style:italic; }
  .nh-t { flex:1; min-width:0; }
  .nh-t .n { font-size:19px; font-weight:800; letter-spacing:-0.03em; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nh-t .c { font-size:12px; color:var(--text-dim); line-height:1.4; }
  .live-tag { font-size:9.5px; font-weight:800; background:var(--accent); color:#fff; padding:1px 6px; border-radius:999px; letter-spacing:.06em; }
  .live-sc { font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; color:var(--accent); background:var(--accent-soft); border:1px solid var(--fav-border); padding:1px 7px; border-radius:6px; }
  .ha { font-size:10px; font-weight:800; padding:1px 6px; border-radius:5px; background:var(--chip-bg); color:var(--text-mid); letter-spacing:-0.01em; }
  .ha.home { background:var(--accent-soft); color:var(--accent); }
  .dday { margin-left:auto; text-align:right; color:var(--accent); font-weight:800; font-size:24px; letter-spacing:-0.04em; line-height:1; flex:0 0 auto; white-space:nowrap; }
  .dday small { font-size:10px; font-weight:600; letter-spacing:.04em; opacity:.7; margin-left:5px; }
  .kick { margin:12px 0 0; padding:0; list-style:none; }
  .kick li { display:flex; align-items:center; gap:10px; font-size:13px; padding:8px 4px; border-bottom:1px solid var(--border-soft); }
  .kick li:last-child { border-bottom:none; }
  .kick .k { font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--text-dim); min-width:44px; }
  .kick .v { font-weight:700; }
  .kick .v small { font-weight:500; color:var(--text-dim); font-size:11.5px; margin-left:3px; }
  .oppo { display:block; margin-top:12px; padding:13px 15px; border-radius:12px; background:var(--bg-soft); border:1px solid var(--border-soft); text-decoration:none; transition:.15s; }
  a.oppo:hover { border-color:var(--accent); background:var(--accent-soft); }
  .oppo-h { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .oppo-h .k { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); }
  .oppo-h .n { font-weight:750; font-size:14px; letter-spacing:-0.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .oppo-h .go { margin-left:auto; font-size:11.5px; font-weight:700; color:var(--accent); white-space:nowrap; }
  .oppo-s { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:8px; }
  .oppo-s span { font-size:11px; color:var(--text-dim); }
  .oppo-s b { display:block; font-size:14px; font-weight:800; color:var(--text); letter-spacing:-0.02em; line-height:1.25; }
  .oppo-i { font-size:12.5px; color:var(--text-mid); line-height:1.55; }

  /* ---------- 다가오는 일정 ---------- */
  .up { list-style:none; margin:0; padding:4px 0; }
  .up li { border-bottom:1px solid var(--border-soft); }
  .up li:last-child { border-bottom:none; }
  .up-a { display:flex; align-items:center; gap:10px; padding:9px 16px; text-decoration:none; transition:background .15s; }
  .up-a:hover { background:var(--bg-soft); }
  .up .nm { flex:1; min-width:0; font-weight:700; font-size:13.5px; letter-spacing:-0.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up .nm small { display:block; font-weight:500; font-size:11px; color:var(--text-dim); }
  .up .dt { font-size:12px; color:var(--text-mid); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; }
  .up .in { font-size:11px; color:var(--accent); font-weight:800; white-space:nowrap; min-width:42px; text-align:center; background:var(--accent-soft); padding:3px 7px; border-radius:999px; }

  /* ---------- 시즌 진행 ---------- */
  .ss-top { display:flex; align-items:flex-end; gap:12px; margin-bottom:12px; }
  .ss-num { font-size:36px; font-weight:800; letter-spacing:-0.04em; line-height:1; }
  .ss-num small { font-size:14px; font-weight:600; color:var(--text-dim); letter-spacing:0; margin-left:2px; }
  .ss-pct { margin-left:auto; text-align:right; }
  .ss-pct b { display:block; font-size:20px; font-weight:800; color:var(--accent); letter-spacing:-0.02em; line-height:1; }
  .ss-pct span { font-size:11px; color:var(--text-dim); }
  .track { position:relative; height:26px; margin:4px 0 6px; }
  .track .rail { position:absolute; left:0; right:0; top:50%; height:4px; margin-top:-2px; border-radius:2px; background:var(--border); }
  .track .fill { position:absolute; left:0; top:50%; height:4px; margin-top:-2px; border-radius:2px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .track i { position:absolute; top:50%; width:7px; height:7px; margin:-3.5px 0 0 -3.5px; border-radius:50%; background:var(--text-dim); opacity:.45; box-sizing:border-box; cursor:default; }
  .track i.done { background:var(--accent); opacity:1; }
  .track i.now { width:13px; height:13px; margin:-6.5px 0 0 -6.5px; background:var(--bg); border:3px solid var(--accent); opacity:1; box-shadow:0 0 0 4px var(--accent-soft); animation:pulse 1.8s ease-in-out infinite; z-index:2; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 4px var(--accent-soft);} 50%{ box-shadow:0 0 0 8px var(--accent-glow);} }
  .track i:hover::after { content:attr(data-t); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); white-space:nowrap; font-size:11px; background:var(--text); color:var(--bg); padding:4px 8px; border-radius:6px; z-index:5; }
  .ss-foot { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); }
  .ss-foot b { color:var(--text-mid); font-weight:600; }
  .ss-line { margin-top:10px; padding:8px 11px; border-radius:10px; background:var(--bg-soft); font-size:12.5px; color:var(--text-mid); display:flex; align-items:center; gap:8px; }
  .ss-line .k { font-size:10.5px; font-weight:700; letter-spacing:.08em; color:var(--accent); white-space:nowrap; }
  .ss-line .v { font-weight:700; color:var(--text); }
  .ss-line .r { margin-left:auto; font-size:11.5px; color:var(--text-dim); white-space:nowrap; }

  /* ---------- 순위표 ---------- */
  .tabs { display:flex; gap:4px; padding:8px 12px 0; border-bottom:1px solid var(--border-soft); }
  .tab { flex:1; border:none; background:transparent; color:var(--text-dim); font:inherit; font-size:13px; font-weight:700; padding:7px 6px 9px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); }
  .stand-body { overflow:auto; position:relative; flex:1 1 auto; min-height:0; }

<script>
(function () {

  // ---------- 유틸 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function compCls(c) { return (COMP_TAG[c] ? c : 'OTHER').toLowerCase(); }

      var open = row.getAttribute('aria-expanded') === 'true';
      Array.prototype.forEach.call(listEl.querySelectorAll('.mv-row[aria-expanded="true"]'), function (r) {

  // 브리핑 항목을 선택 팀 기준으로 정규화. 구버전 { date, file, count, mu } 는 맨유 항목으로 읽는다

  // ---------- 달력 ----------
  var byDay = {};                                       // 로컬 날짜 -> 경기 목록 (순서는 sortDays가 정한다)
  FX.forEach(function (f) { (byDay[ldate(f)] = byDay[ldate(f)] || []).push(f); });
  // 선택 팀 경기를 칸 맨 위로 올린다 — 다섯 번째부터는 "+N" 안에 접히기 때문. 나머지는 킥오프 순
  function sortDays() {

  function mrow(f, hidden) {
    var fav = isFav(f), fin = f.status === 'post' || f.status === 'live';
    var mid = f.status === 'postponed' ? '연기' : (fin ? scoreTxt(f) : hhmm(kd(f)));

    // 칸이 좁아 팀은 3글자 약칭으로 쓰고, 전체 이름은 title 툴팁에 담는다

  function renderCal() {
    document.getElementById('calTitle').textContent = cur.getFullYear() + '년 ' + (cur.getMonth() + 1) + '월';
    var html = '<div class="dows">';
    ['월', '화', '수', '목', '금', '토', '일'].forEach(function (w, i) { html += '<div class="dow' + (i === 5 ? ' sat' : i === 6 ? ' sun' : '') + '">' + w + '</div>'; });
    html += '</div>';
    var first = new Date(cur), offset = (first.getDay() + 6) % 7;      // 월요일 시작
    var start = addDays(first, -offset);

    for (var w = 0; w < 6; w++) {
      // 1) 이 주의 날짜와 매치위크 구간을 먼저 모은다
      var days = [], bars = {}, order = [], anyIn = false;
      for (var i = 0; i < 7; i++) {
        var d = addDays(start, w * 7 + i), k = iso(d), out = d.getMonth() !== cur.getMonth();
        if (!out) anyIn = true;
        var list = byDay[k] || [];
        days.push({ d: d, k: k, out: out, list: list, br: briefByDate[k] });
        list.forEach(function (f) {
          if (f.comp !== 'PL' || !f.mw) return;
          if (!bars[f.mw]) { bars[f.mw] = { from: i + 1, to: i + 1, out: out }; order.push(f.mw); }
          bars[f.mw].to = i + 1;
          if (!out) bars[f.mw].out = false;
        });
      }
      if (w === 5 && !anyIn) break;

      // 2) 겹치는 매치위크 바는 레인으로 쌓는다 (한 주에 두 매치위크가 걸리는 주가 있다)
      var lanes = [];
      order.sort(function (a, b) { return bars[a].from - bars[b].from; }).forEach(function (mw) {
        var b = bars[mw], li = 0;
        while (lanes[li] != null && lanes[li] >= b.from) li++;
        lanes[li] = b.to; b.lane = li;
      });
      var rsv = lanes.length * 24;                                     // 바가 앉을 자리를 날짜 아래에 비워 둔다

      // 3) 셀 + 바 렌더
      var wk = '';
      days.forEach(function (day, ci) {
        var cls = 'cell' + (day.out ? ' out' : '') + (day.k === todayIso ? ' today' : '') +

        var body = '<div class="d">' + day.d.getDate() + (day.k === todayIso ? '<span class="today-tag">오늘</span>' : '') + '</div>';
        if (day.list.length) {
          body += '<div class="mx">';
          day.list.forEach(function (f, n) { body += mrow(f, n >= 4); });
          body += '</div>';

      });
      order.forEach(function (mw) {
        var b = bars[mw], l = MWS[mw] || [], f0 = l[0], f1 = l[l.length - 1];
        var range = f0 ? (md(kd(f0)) + '–' + md(kd(f1))) : '';

      });

    }
    calEl.innerHTML = html;
  }

  // ---------- 시즌 진행 ----------
  function renderSeason() {
    var doneMw = 0, mwDone = {};
    for (var i = 1; i <= MWN; i++) {
      var l = MWS[i] || [];
      mwDone[i] = l.length > 0 && l.every(function (f) { return f.status === 'post'; });
      if (mwDone[i]) doneMw++;
    }
    var curMw = (H.meta && H.meta.currentMw) || 1;
    var pct = Math.round(doneMw / MWN * 100);
    var favSt = (H.standings || []).filter(function (s) { return s.key === TEAM; })[0];
    var favPlayed = favSt ? favSt.played : PL.filter(function (f) { return f.status === 'post' && (f.home.key === TEAM || f.away.key === TEAM); }).length;

    var h = '<div class="ss-top"><div class="ss-num">' + doneMw + '<small>/ ' + MWN + ' 매치위크</small></div><div class="ss-pct"><b>' + pct + '%</b><span>완료</span></div></div>';
    h += '<div class="track"><div class="rail"></div><div class="fill" style="width:' + Math.max(0, (doneMw - 0.5) / MWN * 100).toFixed(2) + '%"></div>';
    for (var m = 1; m <= MWN; m++) {
      var l2 = MWS[m] || [], f0 = l2[0], f1 = l2[l2.length - 1];
      var range = f0 ? (md(kd(f0)) + '–' + md(kd(f1))) : '';
      var cls = mwDone[m] ? 'done' : (m === curMw ? 'now' : '');
      h += '<i class="' + cls + '" style="left:' + (((m - 0.5) / MWN) * 100).toFixed(2) + '%" data-t="MW ' + m + ' · ' + esc(range) + '"></i>';
    }
    h += '</div>';
    var a = (MWS[1] || [])[0], z = (MWS[MWN] || [])[0];
    h += '<div class="ss-foot"><span><b>MW1</b> ' + (a ? md(kd(a)) : '') + '</span><span><b>MW' + MWN + '</b> ' + (z ? md(kd(z)) : '') + '</span></div>';
    var cl = MWS[curMw] || [], c0 = cl[0], c1 = cl[cl.length - 1];
    h += '<div class="ss-line"><span class="k">NEXT</span><span class="v">MW ' + curMw + '</span><span>' + (c0 ? esc(md(kd(c0)) + '–' + md(kd(c1))) : '') + '</span><span class="r">남은 매치위크 ' + (MWN - doneMw) + '</span></div>';
    h += '<div class="ss-line"><span class="k">' + esc(teamKo()) + '</span><span class="v">리그 ' + favPlayed + ' / ' + MWN + '경기</span><span class="r">' + (favSt ? favSt.points + '점 · ' + favSt.rank + '위' : '') + '</span></div>';
    document.getElementById('seasonBody').innerHTML = h;
    document.getElementById('seasonSub').textContent = doneMw + ' / ' + MWN + ' 완료';
  }

  // ---------- 순위표 ----------
  function renderStand() {
    var ZONE = { 'UEFA Champions League': 'var(--z-ucl)', 'UEFA Europa League': 'var(--z-uel)', 'UEFA Conference League': 'var(--z-uecl)', 'Relegation': 'var(--z-rel)' };
    var S = H.standings || [];
    var h = '<thead><tr><th></th><th></th><th class="l">팀</th><th></th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>PTS</th><th style="text-align:right;padding-right:6px">최근 6경기</th></tr></thead><tbody>';
    S.forEach(function (t) {
      var isFavTeam = t.key === TEAM, z = ZONE[t.zone] || 'transparent';
      var dch = (typeof t.rankPrev === 'number') ? (t.rankPrev - t.rank) : 0;
      var ch = dch > 0 ? '<span class="ch up">▲' + dch + '</span>' : (dch < 0 ? '<span class="ch dn">▼' + (-dch) + '</span>' : '<span class="ch">–</span>');
      var fm = (t.form || []).map(function (r) { return '<span class="fp ' + (r === 'W' || r === 'D' || r === 'L' ? r : 'n') + '">' + (r === '-' ? '' : esc(r)) + '</span>'; }).join('');
      h += '<tr' + (isFavTeam ? ' class="fav-row"' : '') + '>' +
        '<td class="pos">' + t.rank + '</td>' +
        '<td class="zb"><i style="background:' + z + '"></i></td>' +
        '<td class="tm"><a href="' + clubHref(t.key) + '" title="' + esc(t.name) + ' 구단 가이드">' + badge(t.key, 18, t) + '<span class="nm">' + esc(koName(t.key, t.name)) + '</span></a></td>' +
        '<td class="ch">' + ch + '</td>' +
        '<td>' + t.played + '</td><td>' + t.won + '</td><td>' + t.drawn + '</td><td>' + t.lost + '</td>' +
        '<td>' + (t.gd > 0 ? '+' + t.gd : t.gd) + '</td><td class="pt">' + t.points + '</td>' +
        '<td class="fm">' + fm + '</td></tr>';
    });
    document.getElementById('tblT').innerHTML = h + '</tbody>';
    var pl = PL.filter(function (f) { return f.status === 'post'; }).length;
    document.getElementById('asofTxt').textContent = pl + '경기 기준';
  }

  // ---------- 득점·어시스트 ----------
  var byAssist = false;
  function renderScorers() {
    var list = (H.scorers || []).slice().sort(function (a, b) {
      return byAssist ? ((b.assists - a.assists) || (b.goals - a.goals)) : ((b.goals - a.goals) || (b.assists - a.assists));
    }).slice(0, 20);
    var h = '<thead><tr><th></th><th class="l">선수</th><th>팀</th><th>득점</th><th>AST</th><th>출전</th></tr></thead><tbody>';
    list.forEach(function (p, i) {
      h += '<tr' + (p.team === TEAM ? ' class="fav-row"' : '') + '>' +
        '<td class="pos">' + (i + 1) + '</td>' +
        '<td class="tm"><span class="t"><span class="nm">' + esc(p.name) + '</span></span></td>' +
        '<td>' + (isPL(p.team) ? '<a href="' + clubHref(p.team) + '" title="' + esc(p.teamShort || p.team) + '">' + badge(p.team, 17, { short: p.teamShort }) + '</a>' : badge(p.team, 17, { short: p.teamShort })) + '</td>' +
        '<td class="pt">' + p.goals + '</td><td>' + p.assists + '</td><td>' + p.played + '</td></tr>';
    });
    document.getElementById('tblS').innerHTML = h + '</tbody>';
  }
  (function () {
    var bg = document.getElementById('sortG'), ba = document.getElementById('sortA');
    bg.onclick = function () { byAssist = false; bg.setAttribute('aria-pressed', 'true'); ba.setAttribute('aria-pressed', 'false'); safe('tblS', renderScorers); };
    ba.onclick = function () { byAssist = true; ba.setAttribute('aria-pressed', 'true'); bg.setAttribute('aria-pressed', 'false'); safe('tblS', renderScorers); };
  })();

  // 탭
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  tabs.forEach(function (t) {
    t.onclick = function () {
      tabs.forEach(function (x) { x.setAttribute('aria-selected', String(x === t)); });
      Array.prototype.slice.call(document.querySelectorAll('.pane')).forEach(function (p) { p.classList.toggle('on', p.id === t.getAttribute('data-pane')); });
    };
  });

  // ---------- 선택 팀 최근 경기 ----------
  function renderRecent() {
    var done = FAV_FX.filter(function (f) { return f.status === 'post'; }).sort(function (a, b) { return kd(b) - kd(a); });
    var last5 = done.slice(0, 5);
    document.getElementById('recentSub').textContent = '전 대회 · 최근 ' + last5.length + '경기';
    var fs = document.getElementById('formStrip');
    fs.innerHTML = last5.length
      ? '<span class="k">FORM</span>' + last5.slice().reverse().map(function (f) { var r = favRes(f); return '<span class="fp ' + (r || 'n') + '" title="' + esc((f.home.key === TEAM ? f.away.name : f.home.name) + ' ' + scoreTxt(f)) + '">' + esc(r) + '</span>'; }).join('')
      : '<span class="k">FORM</span><span style="font-size:12px;color:var(--text-dim)">기록 없음</span>';
    var h = '';
    last5.forEach(function (f) {
      var home = f.home.key === TEAM, opp = home ? f.away : f.home, r = favRes(f), k = kd(f);
      var gl = goals(f.scorers && f.scorers[home ? 'home' : 'away']);
      var gs = gl.map(function (s) { return s.name + ' ' + (s.times || []).map(function (t, i) { return t + goalMark(s.types && s.types[i]); }).join(','); }).join(' · ');
      var gsShort = gl.map(function (s) { var n = (s.times || []).length || 1, og = (s.types || []).every(function (t) { return t === 'og'; }) && n; return s.name + (n > 1 ? ' ×' + n : '') + (og ? ' (OG)' : ''); }).join(' · ');
      h += '<li><div class="rec-a mv-row"' + rowAttrs('mvr-', f, scoreTxt(f)) + '>' +
        '<span class="rp ' + (r || 'D') + '">' + esc(r) + '</span>' +
        '<span class="sc">' + esc(home ? scoreTxt(f) : (f.score ? f.score.away + '-' + f.score.home : '')) + '</span>' +
        badge(opp.key, 24, opp) +
        '<span class="op"><span class="n"><span class="nm">' + esc(koName(opp.key, opp.name)) + '</span><span class="ha' + (home ? ' home' : '') + '">' + (home ? '홈' : '원정') + '</span>' + compTag(f.comp) + '</span>' +
        '<span class="g">' + (gs ? esc(gs) : '득점 없음') + '</span></span>' +
        '<span class="dt">' + (k.getMonth() + 1) + '/' + k.getDate() + '<br>(' + DOW[k.getDay()] + ')</span>' +
        '<span class="mv-caret" aria-hidden="true">▾</span>' +
        '<span class="gline">' + (gsShort ? esc(gsShort) : '득점 없음') + '</span>' +
        '</div>' + panelHtml('mvr-', f) + '</li>';
    });
    document.getElementById('recentList').innerHTML = h || '<li class="empty">아직 치른 경기가 없습니다.</li>';
  }
  wireRows(document.getElementById('recentList'));

  // ---------- 매치위크 스코어보드 ----------
  var mwCur = (H.meta && H.meta.currentMw) || 1;
  function setMw(n) {
    if (!(n >= 1 && n <= MWN)) return;
    mwCur = n;
    safe('mwList', function () {
      var l = (MWS[n] || []).slice().sort(function (a, b) { return kd(a) - kd(b); });
      document.getElementById('mwLabel').textContent = 'MW ' + n;
      document.getElementById('mwPrev').disabled = n <= 1;
      document.getElementById('mwNext').disabled = n >= MWN;
      var f0 = l[0], f1 = l[l.length - 1];
      var doneN = l.filter(function (f) { return f.status === 'post'; }).length;
      document.getElementById('mwRange').textContent = f0
        ? ((kd(f0).getMonth() + 1) + '월 ' + kd(f0).getDate() + '일 – ' + (kd(f1).getMonth() + 1) + '월 ' + kd(f1).getDate() + '일 · ' + doneN + '/' + l.length + '경기 종료')
        : '경기 없음';
      var h = '';
      l.forEach(function (f) {
        var fav = isFav(f), fin = f.status === 'post' || f.status === 'live', k = kd(f);
        var gs = ['home', 'away'].map(function (s) {
          return goals(f.scorers && f.scorers[s]).map(function (x) { return x.name + ' ' + (x.times || []).join(','); }).join(', ');
        }).filter(Boolean).join(' | ');
        var res = f.status === 'postponed' ? '<span class="res t">연기</span>'
          : (fin ? '<span class="res">' + esc(scoreTxt(f)) + '</span>' : '<span class="res t">' + hhmm(k) + '</span>');
        h += '<li' + (fav ? ' class="fav-row"' : '') + '>' +
          '<div class="sb-r mv-row"' + rowAttrs('mvs-', f, gs) + '>' +
          '<span class="when">' + md(k) + ' (' + DOW[k.getDay()] + ')</span>' +
          '<span class="side h"><span class="nm">' + esc(shortOf(f.home)) + '</span>' + badge(f.home.key, 20, f.home) + '</span>' +
          res +
          '<span class="side"><span>' + badge(f.away.key, 20, f.away) + '</span><span class="nm">' + esc(shortOf(f.away)) + '</span></span>' +
          '<span class="mv-caret" aria-hidden="true">▾</span>' +
          '</div>' + panelHtml('mvs-', f) + '</li>';
      });
      document.getElementById('mwList').innerHTML = h || '<li class="empty">경기가 없습니다.</li>';
    });
  }
  wireRows(document.getElementById('mwList'));
  document.getElementById('mwPrev').onclick = function () { setMw(mwCur - 1); };
  document.getElementById('mwNext').onclick = function () { setMw(mwCur + 1); };

  // ---------- 최신 브리핑 (선택 팀 것만) ----------
  function renderLatest() {
    var lb = briefs[0];
    var card = document.getElementById('latestCard');
    if (!lb) {
      card.style.display = 'none';
      document.querySelector('.col3').classList.add('solo');   // 순위표가 컬럼을 다 쓰게
      document.getElementById('latestSub').textContent = '';
      document.getElementById('latestBody').innerHTML = '';
      return;
    }
    card.style.display = '';
    document.querySelector('.col3').classList.remove('solo');
    var p = String(lb.date).split('-'), ld = new Date(+p[0], +p[1] - 1, +p[2]);
    var ago = Math.round((today - ld) / 86400000);
    document.getElementById('latestSub').textContent = ago === 0 ? '오늘' : (ago === 1 ? '어제' : ago + '일 전');
    document.getElementById('latestBody').innerHTML =
      '<div class="latest-date">' + esc(lb.date).replace(/-/g, '.') + ' (' + DOW[ld.getDay()] + ')</div>' +
      '<div class="latest-head">' + esc(lb.headline || '') + '</div>' +
      '<div class="latest-meta">기사 ' + (lb.count || 0) + '건 · ' + esc(teamKo()) + ' ' + (lb.team || 0) + '건</div>' +
      '<a class="btn primary" href="' + esc(link(lb.file)) + '">브리핑 열기 <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>';
  }

  // ---------- 브리핑 아카이브 ----------
  function renderArchive() {
    document.getElementById('archSub').textContent = briefs.length + '건';
    var ko = teamKo(), h = '';
    briefs.forEach(function (b) {
      var p = String(b.date).split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
      h += '<li><div class="arch-date">' + esc(b.date).replace(/-/g, '.') + '<small>' + DOW[d.getDay()] + '요일</small></div>' +
        '<div class="arch-head">' + esc(b.headline || '') + '</div>' +
        '<div class="arch-meta">기사 ' + (b.count || 0) + '건 · ' + esc(ko) + ' ' + (b.team || 0) + '건</div>' +
        '<a class="btn primary" href="' + esc(link(b.file)) + '">열기</a></li>';
    });
    document.getElementById('archList').innerHTML = h || '<li class="empty">아직 브리핑이 없습니다.</li>';
  }

  // ---------- 팀이 바뀌면 팀에 걸린 것만 다시 그린다 (새로고침 없음) ----------
  function renderTeam() {
    TEAM = T ? T.get() : DEF;
    calcTeam();
    renderChrome();
    safe('cal', renderCal);
    safe('nextBody', renderNext);
    safe('upcoming', renderUpcoming);
    safe('seasonBody', renderSeason);
    safe('tblT', renderStand);
    safe('tblS', renderScorers);
    safe('recentList', renderRecent);
    setMw(mwCur);
    safe('latestBody', renderLatest);
    safe('archList', renderArchive);
  }
  if (T) T.onChange(renderTeam);
  renderTeam();
})();
</script>
