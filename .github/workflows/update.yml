name: update-data

# BBC Sport에서 경기·순위·득점(data.js)과 경기 상세(matches/)를 받아 커밋합니다.
# - 경기 시간대(UTC 11~23시 = 한국 20시~다음날 8시)에는 15분마다: 라인업 발표·진행 상황·최종 기록
# - 매일 UTC 0시(한국 09시)에 전체 갱신
# 실행이 성공하면 매번 커밋합니다(데이터가 같아도 meta.updatedAt = 이번 확인 시각). GitHub Pages가 자동으로 다시 배포합니다.

on:
  schedule:
    - cron: "*/15 11-23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update.yml"
      - "scripts/update-data.mjs"
      - "scripts/update-matches.mjs"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh data.js (fixtures, table, scorers)
        run: node scripts/update-data.mjs

      - name: Refresh match details (lineups, events, stats)
        run: node scripts/update-matches.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "red-devils-hub-bot"
          git config user.email "red-devils-hub-bot@users.noreply.github.com"
          git add data.js matches/
          # 갱신 시각(meta.updatedAt)이 매번 바뀌므로 성공한 실행은 항상 커밋된다 — 헤더의 "갱신" 시각 = 마지막 성공 확인 시각
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
